# NO auto-aplicado por kustomize de infra/. El pipeline
# sciencemanager/docs/.github/workflows/deploy.yml solo parchea la imagen
# (`kubectl set image deployment/sciencemanager-docs ...`) — este archivo
# es la fuente de verdad para replicas, resources y probes. Úsalo para
# recrear el Deployment a mano si se borra.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciencemanager-docs
  namespace: science-manager
  labels:
    app: sciencemanager-docs
    app.kubernetes.io/part-of: science-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sciencemanager-docs
  template:
    metadata:
      labels:
        app: sciencemanager-docs
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: sciencemanager-docs
          image: ghcr.io/sciencemanager/docs:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /docs/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs/
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
