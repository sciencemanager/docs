name: Deploy Docs to K8s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docs

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Build & Push de la imagen Docker
  # ─────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────
  # Job 2: Deploy en K8s via SSH
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Refresca ghcr-pull-secret con el GITHUB_TOKEN efímero del propio run,
      # evitando depender de un PAT de larga duración que expira/rota.
      - name: Refresh GHCR pull secret
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            echo "==> Refreshing ghcr-pull-secret"
            kubectl -n science-manager create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_ACTOR" \
              --docker-password="$GHCR_TOKEN" \
              --docker-email=admin@sciencemanager.cloud \
              --dry-run=client -o yaml | kubectl apply -f -
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}"

            echo "==> Deploying docs image: ${IMAGE}"

            kubectl -n science-manager set image deployment/sciencemanager-docs \
              sciencemanager-docs="${IMAGE}"

            kubectl -n science-manager rollout status deployment/sciencemanager-docs --timeout=120s

            echo "==> Docs deploy completado"

      # Requiere el parche de Ingress (pendiente, ver sciencemanager-docs-setup.tasks.md
      # Phase 4) para que sciencemanager.cloud/docs resuelva al pod.
      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 5
            HTTP_CODE=$(curl -o /dev/null -s -w '%{http_code}' https://sciencemanager.cloud/docs/ || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "[ERROR] Docs no responde (HTTP $HTTP_CODE)"
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
              kubectl -n science-manager logs deployment/sciencemanager-docs --tail=30
              exit 1
            fi
            echo "==> Docs health check OK (HTTP 200)"

  rollback:
    name: Rollback on failure
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            echo "==> ROLLBACK docs..."
            kubectl -n science-manager rollout undo deployment/sciencemanager-docs
            kubectl -n science-manager rollout status deployment/sciencemanager-docs --timeout=120s
            echo "==> Rollback completado"
